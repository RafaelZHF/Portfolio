<!-- ============ NAVBAR ============
     Brand & mark diambil dari CONTENT.navbar (content.js) supaya tetap
     konsisten dengan situs utama kalau kamu ganti nama brand dari
     dashboard. Link navigasi SENGAJA tidak dipakai dari
     CONTENT.navbar.links di sini — link itu berisi anchor section
     (#tentang, #genre, dst) yang cuma ada di index.html utama, jadi
     kalau dipasang apa adanya di halaman ini semuanya akan patah.
     Sebagai gantinya, navbar shop cukup punya brand + tombol kembali
     ke situs utama. -->
<header class="navbar real-content" id="navbar">
<div class="container navbar-inner">
<a class="brand" href="../index.html"><span aria-hidden="true" class="brand-mark"></span><span id="navBrandText"></span></a>
<div class="navbar-actions">
<a class="btn btn-ghost" href="../index.html#kontak" id="navBtnGhost">Hubungi Saya</a>
<a class="btn btn-primary" href="../index.html" id="navBtnPrimary">Kembali ke Situs</a>
</div>
</div>
</header>

<main class="real-content" id="beranda">
<!-- ============ HEADER SHOP ============ -->
<section class="shop-header container">
<div class="shop-header-eyebrow reveal"><span class="dot-live"></span><span>Katalog Produk</span></div>
<h1 class="reveal" id="shopHeading">Shop</h1>
<p class="reveal" id="shopSub">Sample pack, preset, dan rilisan digital dari studio Rafael L3.</p>
</section>

<!-- ============ GRID PRODUK ============ -->
<div class="container">
<div class="product-grid reveal-stagger" id="productGrid" style="display:none;"></div>
<div class="shop-empty" id="shopEmpty" style="display:none;">
<svg class="shop-empty-icon" fill="none" stroke="currentColor" stroke-width="1.4" viewbox="0 0 24 24"><path d="M3 7h18l-1.5 12.5a2 2 0 01-2 1.5H6.5a2 2 0 01-2-1.5L3 7z"></path><path d="M8 7V5a4 4 0 018 0v2"></path></svg>
<h2>Belum ada produk</h2>
<p>Katalog akan segera diisi — pantau terus halaman ini untuk rilisan berikutnya.</p>
</div>
</div>
</main>
